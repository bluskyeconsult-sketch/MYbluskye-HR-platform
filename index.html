<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    
    <!-- ============================================
         FAVICONS & APP ICONS
    ============================================ -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- ============================================
         VIEWPORT & RESPONSIVENESS (Optimized for mobile)
    ============================================ -->
    <!-- Primary viewport - ensures proper scaling on all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Secondary viewport for zoom prevention on inputs (critical for mobile) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    
    <!-- ============================================
         PWA & THEME
    ============================================ -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- ============================================
         SEO & DESCRIPTION
    ============================================ -->
    <meta name="description" content="ODUSBABA - AI-Powered Career Platform. Find jobs, take courses, and advance your career with intelligent tools." />
    <meta name="keywords" content="jobs, career, AI, courses, assessments, HR platform, odusbaba, bluskye" />
    <meta name="author" content="BluSkye Integrated Consult" />
    
    <!-- ============================================
         OPEN GRAPH / SOCIAL MEDIA
    ============================================ -->
    <meta property="og:title" content="ODUSBABA | BluSkye Integrated Consult" />
    <meta property="og:description" content="AI-Powered Career Platform. Find your next opportunity with ODUSBABA." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.bluskyeconsult.com" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="ODUSBABA" />
    
    <!-- ============================================
         TWITTER CARD
    ============================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ODUSBABA | BluSkye Integrated Consult" />
    <meta name="twitter:description" content="AI-Powered Career Platform. Find your next opportunity with ODUSBABA." />
    <meta name="twitter:image" content="/twitter-image.png" />
    
    <!-- ============================================
         PRELOAD & PERFORMANCE
    ============================================ -->
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://api.openai.com" />
    <link rel="preconnect" href="https://supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Font preload for better performance -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- ============================================
         TITLE
    ============================================ -->
    <title>ODUSBABA | BluSkye Integrated Consult - AI Career Platform</title>
</head>
<body>
    <!-- ✅ ROOT DIV - MUST EXIST for React to mount -->
    <div id="root"></div>
    
    <!-- Main entry point -->
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
